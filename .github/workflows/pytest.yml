# CI: the test suite of the public snapshot on clean Windows and Linux runners (two jobs, both required).
# Same command as the local "pytest src" run on the exported snapshot; xfail ids must equal .github/known_xfail.txt,
# skipped tests must equal the list of the platform: .github/known_skips.txt (windows-latest),
# .github/known_skips_linux.txt (ubuntu-latest) -- an unexpected or a vanished skip fails the job.
# No secrets, read-only token, network only for installing packages.
# Triggers: pushes to ci/** branches and manual runs. A commit is checked once; the published branches are moved to
# an already checked commit (status checks are bound to the commit SHA), so a push to them starts no second run.
# Test reports (txt + junit xml) are kept as run artifacts for 7 days; the 30 slowest tests are listed in the log.
# Actions are pinned to a full commit SHA (release tag in the comment).
# Checkout depth 2: the parent snapshot is needed by the test weakening guard (tools/weakening_guard.py); the live-clock
# guard of the tests runs inside the suite (src/test_clock_guard_b30.py, exceptions in .github/live_clock_allow.txt).
# Control map (B32): each pytest job checks docs/control_map.csv against its own JUnit reports (a confirming test
# that is not PASS -> red job), so the two required jobs green = every confirming test PASS on both platforms.
# Job control-map (B32h), after both pytest jobs: the control map over BOTH platforms (a confirming test counts only
# with PASS in the JUnit reports of both jobs) and docs/CONTROL_MAP.md against a fresh copy; EXIT != 0 -> red job.
name: pytest

on:
  push:
    branches: ['ci/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pytest-${{ github.sha }}
  cancel-in-progress: false

jobs:
  pytest-windows:
    name: pytest-windows
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock

      - name: Install dependencies (versions pinned by requirements.lock)
        shell: pwsh
        run: |
          python --version
          python -m pip install -c requirements.lock -r requirements.txt pytest pillow pypdf scipy python-docx openpyxl pyloudnorm PyQt6 pymupdf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Weakened tests vs the parent snapshot (HEAD~1): removed tests / asserts, new skips, wider tolerances; each
      # finding is red unless listed in .github/test_weakening_allow.txt (test | reason | date | consent code).
      - name: test weakening guard (parent snapshot)
        if: always()
        shell: cmd
        run: python tools/weakening_guard.py --base HEAD~1 --head HEAD --allow .github/test_weakening_allow.txt

      # cmd, not pwsh: pwsh 7 puts its module paths into PSModulePath, and the Windows PowerShell 5.1 started by the
      # tests then cannot load Get-Acl / Get-FileHash.
      - name: pytest src
        shell: cmd
        run: |
          python -m pytest src -q -p no:cacheprovider -rxs --durations=30 --junitxml=pytest_src.xml > pytest_src.txt 2>&1
          set PYTEST_RC=%ERRORLEVEL%
          type pytest_src.txt
          exit /b %PYTEST_RC%

      # Tests outside src/ that need no network and no live model (explicit list; testpaths is not changed).
      - name: pytest root and tools
        if: always()
        shell: cmd
        run: |
          python -m pytest test_data_hygiene.py tools/test_calibrate_sigma.py tools/test_check_sigma_2e.py -q -p no:cacheprovider -rxs --junitxml=pytest_extra.xml > pytest_extra.txt 2>&1
          set PYTEST_RC=%ERRORLEVEL%
          type pytest_extra.txt
          exit /b %PYTEST_RC%

      - name: xfail ids = known list
        if: always()
        shell: pwsh
        run: |
          $known = @(Get-Content .github/known_xfail.txt | Where-Object { $_.Trim() } | ForEach-Object { $_.Trim() } | Sort-Object)
          $got = @(Get-Content pytest_src.txt, pytest_extra.txt | Where-Object { $_.StartsWith("XFAIL ") } | ForEach-Object { ($_.Substring(6) -split ' - ', 2)[0].Trim() } | Sort-Object)
          $unexpected = @($got | Where-Object { $known -notcontains $_ })
          $missing = @($known | Where-Object { $got -notcontains $_ })
          foreach ($x in $unexpected) { Write-Output "UNEXPECTED XFAIL $x" }
          foreach ($x in $missing) { Write-Output "MISSING XFAIL $x" }
          Write-Output "xfail: got $($got.Count), known $($known.Count), unexpected $($unexpected.Count), missing $($missing.Count)"
          if ($unexpected.Count -or $missing.Count) { exit 1 }

      - name: skipped tests = known list
        if: always()
        shell: pwsh
        run: |
          $known = @(Get-Content .github/known_skips.txt -Encoding utf8 | Where-Object { $_.Trim() -and -not $_.StartsWith("#") } | ForEach-Object { $_.Trim() } | Sort-Object)
          $got = @()
          foreach ($f in @("pytest_src.xml", "pytest_extra.xml")) {
            if (-not (Test-Path $f)) { Write-Output "MISSING REPORT $f"; exit 1 }
            $x = New-Object System.Xml.XmlDocument
            $x.Load((Resolve-Path $f).Path)
            foreach ($tc in $x.SelectNodes("//testcase[skipped]")) {
              $sk = $tc.SelectSingleNode("skipped")
              if ($sk.GetAttribute("type") -eq "pytest.xfail") { continue }
              $got += "$($tc.GetAttribute('classname'))::$($tc.GetAttribute('name')) | $($sk.GetAttribute('message'))"
            }
          }
          $unexpected = @($got | Where-Object { $known -notcontains $_ })
          $missing = @($known | Where-Object { $got -notcontains $_ })
          foreach ($x in $unexpected) { Write-Output "UNEXPECTED SKIP $x" }
          foreach ($x in $missing) { Write-Output "MISSING SKIP $x" }
          Write-Output "skipped: got $($got.Count), known $($known.Count), unexpected $($unexpected.Count), missing $($missing.Count)"
          if ($unexpected.Count -or $missing.Count) { exit 1 }

      # Control map vs the JUnit reports of this job (B32): FAIL / ERROR / SKIP without known_gap / XFAIL / XPASS /
      # missing -> red; one platform prints "1 of 2" and gives no PASS (PASS = both required jobs green).
      - name: control map (this platform)
        if: always()
        shell: cmd
        run: python tools/verify_control_map.py --junit windows=pytest_src.xml --junit windows=pytest_extra.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: pytest-reports-windows
          path: |
            pytest_src.txt
            pytest_src.xml
            pytest_extra.txt
            pytest_extra.xml
          if-no-files-found: warn
          retention-days: 7

  # The same suite on Linux: the same packages and pytest commands; Windows-only tests are skipped by sys.platform and
  # listed in .github/known_skips_linux.txt. pwsh (preinstalled on the runner) runs the PowerShell tests of the suite.
  pytest-linux:
    name: pytest-linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock

      # Qt runtime of the PyQt6 wheel (offscreen platform); without it the window tests would be skipped.
      - name: System libraries (Qt runtime)
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install dependencies (versions pinned by requirements.lock)
        shell: pwsh
        run: |
          python --version
          pwsh --version
          python -m pip install -c requirements.lock -r requirements.txt pytest pillow pypdf scipy python-docx openpyxl pyloudnorm PyQt6 pymupdf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: test weakening guard (parent snapshot)
        if: always()
        shell: bash
        run: python tools/weakening_guard.py --base HEAD~1 --head HEAD --allow .github/test_weakening_allow.txt

      # bash with set +e: the report is printed before the exit code of pytest is returned (same as the cmd step).
      - name: pytest src
        shell: bash
        run: |
          set +e
          python -m pytest src -q -p no:cacheprovider -rxs --durations=30 --junitxml=pytest_src.xml > pytest_src.txt 2>&1
          PYTEST_RC=$?
          cat pytest_src.txt
          exit $PYTEST_RC

      # Tests outside src/ that need no network and no live model (explicit list; testpaths is not changed).
      - name: pytest root and tools
        if: always()
        shell: bash
        run: |
          set +e
          python -m pytest test_data_hygiene.py tools/test_calibrate_sigma.py tools/test_check_sigma_2e.py -q -p no:cacheprovider -rxs --junitxml=pytest_extra.xml > pytest_extra.txt 2>&1
          PYTEST_RC=$?
          cat pytest_extra.txt
          exit $PYTEST_RC

      - name: xfail ids = known list
        if: always()
        shell: pwsh
        run: |
          $known = @(Get-Content .github/known_xfail.txt | Where-Object { $_.Trim() } | ForEach-Object { $_.Trim() } | Sort-Object)
          $got = @(Get-Content pytest_src.txt, pytest_extra.txt | Where-Object { $_.StartsWith("XFAIL ") } | ForEach-Object { ($_.Substring(6) -split ' - ', 2)[0].Trim() } | Sort-Object)
          $unexpected = @($got | Where-Object { $known -notcontains $_ })
          $missing = @($known | Where-Object { $got -notcontains $_ })
          foreach ($x in $unexpected) { Write-Output "UNEXPECTED XFAIL $x" }
          foreach ($x in $missing) { Write-Output "MISSING XFAIL $x" }
          Write-Output "xfail: got $($got.Count), known $($known.Count), unexpected $($unexpected.Count), missing $($missing.Count)"
          if ($unexpected.Count -or $missing.Count) { exit 1 }

      - name: skipped tests = known list
        if: always()
        shell: pwsh
        run: |
          $known = @(Get-Content .github/known_skips_linux.txt -Encoding utf8 | Where-Object { $_.Trim() -and -not $_.StartsWith("#") } | ForEach-Object { $_.Trim() } | Sort-Object)
          $got = @()
          foreach ($f in @("pytest_src.xml", "pytest_extra.xml")) {
            if (-not (Test-Path $f)) { Write-Output "MISSING REPORT $f"; exit 1 }
            $x = New-Object System.Xml.XmlDocument
            $x.Load((Resolve-Path $f).Path)
            foreach ($tc in $x.SelectNodes("//testcase[skipped]")) {
              $sk = $tc.SelectSingleNode("skipped")
              if ($sk.GetAttribute("type") -eq "pytest.xfail") { continue }
              $got += "$($tc.GetAttribute('classname'))::$($tc.GetAttribute('name')) | $($sk.GetAttribute('message'))"
            }
          }
          $unexpected = @($got | Where-Object { $known -notcontains $_ })
          $missing = @($known | Where-Object { $got -notcontains $_ })
          foreach ($x in $unexpected) { Write-Output "UNEXPECTED SKIP $x" }
          foreach ($x in $missing) { Write-Output "MISSING SKIP $x" }
          Write-Output "skipped: got $($got.Count), known $($known.Count), unexpected $($unexpected.Count), missing $($missing.Count)"
          if ($unexpected.Count -or $missing.Count) { exit 1 }

      # Control map vs the JUnit reports of this job (B32), as in the Windows job.
      - name: control map (this platform)
        if: always()
        shell: bash
        run: python tools/verify_control_map.py --junit linux=pytest_src.xml --junit linux=pytest_extra.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: pytest-reports-linux
          path: |
            pytest_src.txt
            pytest_src.xml
            pytest_extra.txt
            pytest_extra.xml
          if-no-files-found: warn
          retention-days: 7

  # Control map over both platforms (B32h): the JUnit reports come from the artifacts of the two jobs; the verifier
  # needs only the standard library (no packages, no network). Its verdict line and exit code also go to a notice
  # annotation of this check run ("both_platforms=yes|no EXIT=<n> | <verdict line>"), readable without a token.
  control-map:
    name: control-map
    needs: [pytest-windows, pytest-linux]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: pytest-reports-windows
          path: reports/windows

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: pytest-reports-linux
          path: reports/linux

      - name: control map (both platforms) + map freshness
        shell: bash
        run: |
          set +e
          python tools/verify_control_map.py \
            --junit windows=reports/windows/pytest_src.xml --junit windows=reports/windows/pytest_extra.xml \
            --junit linux=reports/linux/pytest_src.xml --junit linux=reports/linux/pytest_extra.xml \
            --check-md docs/CONTROL_MAP.md --write-md control_map_fresh.md --generated-on "$GITHUB_SHA" > control_map_verify.txt 2>&1
          rc=$?
          cat control_map_verify.txt
          line=$(grep -m1 '^проверено на ' control_map_verify.txt)
          both=no
          if grep -qx 'проверено на 2 платформах из 2' control_map_verify.txt; then both=yes; fi
          echo "::notice title=control-map::both_platforms=${both} EXIT=${rc} | ${line:-no verdict line}"
          exit $rc

      - name: Upload control map reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: control-map
          path: |
            control_map_verify.txt
            control_map_fresh.md
          if-no-files-found: warn
          retention-days: 7

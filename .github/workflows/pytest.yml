# CI: the test suite of the public snapshot on clean Windows and Linux runners + the control map (three jobs, all required).
# Same command as the local "pytest src" run on the exported snapshot; xfail ids must equal .github/known_xfail.txt,
# skipped tests must equal the list of the platform: .github/known_skips.txt (windows-latest),
# .github/known_skips_linux.txt (ubuntu-latest) -- an unexpected or a vanished skip fails the job.
# No secrets, read-only token, network only for installing packages.
# Triggers: pushes to ci/** branches and manual runs. A commit is checked once; the published branches are moved to
# an already checked commit (status checks are bound to the commit SHA), so a push to them starts no second run.
# Test reports (txt + junit xml) are kept as run artifacts for 7 days; the 30 slowest tests are listed in the log.
# Actions are pinned to a full commit SHA (release tag in the comment).
# Checkout depth 0 (B33 v2): the base of the guard and of the map delta is the PUBLISHED commit (git merge-base HEAD
# origin/oko-live), not HEAD~1, so a release of two commits cannot hide the first one; no base -> red step. The live-clock
# guard of the tests runs inside the suite (src/test_clock_guard_b30.py, exceptions in .github/live_clock_allow.txt).
# Control map (B32): each pytest job checks docs/control_map.csv against its own JUnit reports (a confirming test
# that is not PASS -> red job), so the two required jobs green = every confirming test PASS on both platforms.
# Job control-map (B32h), after both pytest jobs: the control map over BOTH platforms (a confirming test counts only
# with PASS in the JUnit reports of both jobs) and docs/CONTROL_MAP.md against a fresh copy; EXIT != 0 -> red job.
# B33: the weakening guard runs twice in each pytest job -- with the code of this snapshot and with the code of the
# published base (B33 v2: git show <merge-base HEAD origin/oko-live>:..., so a change of the guard cannot certify itself;
# it takes effect from the next snapshot) -- plus mutation smokes of the guard and of the red-zone implementation.
name: pytest

on:
  push:
    branches: ['ci/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pytest-${{ github.sha }}
  cancel-in-progress: false

jobs:
  pytest-windows:
    name: pytest-windows
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock

      - name: Install dependencies (versions pinned by requirements.lock)
        shell: pwsh
        run: |
          python --version
          python -m pip install -c requirements.lock -r requirements.txt pytest pillow pypdf scipy python-docx openpyxl pyloudnorm PyQt6 pymupdf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Weakened tests vs the published base (B33 v2: --base auto = merge-base HEAD origin/oko-live, fetch-depth 0; no
      # base -> red): removed tests / asserts / collected node IDs / parametrize values, new skips, wider tolerances;
      # each finding is red unless listed in .github/test_weakening_allow.txt (key | reason | date | code | entry_sha16).
      - name: test weakening guard (published base)
        if: always()
        shell: cmd
        run: python tools/weakening_guard.py --base auto --head HEAD --collect --allow .github/test_weakening_allow.txt

      # B33 (H2.5) + B33 v2 (C3): the same guard with its code taken from the BASE = the published commit (git
      # merge-base HEAD origin/oko-live; none -> red): a change of the guard cannot certify itself; it takes effect
      # from the next snapshot. Lists from this snapshot; --collect only when the base guard knows it.
      - name: test weakening guard (code of the published base)
        if: always()
        shell: python
        run: |
          import os, subprocess, sys, tempfile
          mb = subprocess.run(["git", "merge-base", "HEAD", "refs/remotes/origin/oko-live"], capture_output=True, text=True)
          base = mb.stdout.strip()
          if mb.returncode != 0 or not base:
              print("WEAKENING_ERROR no published base (merge-base HEAD origin/oko-live) -- red")
              sys.exit(2)
          d = tempfile.mkdtemp(prefix="guard_base_")
          for rel in ("src/weakening_guard.py", "tools/weakening_guard.py"):
              os.makedirs(os.path.join(d, os.path.dirname(rel)), exist_ok=True)
              with open(os.path.join(d, rel), "wb") as fh:
                  fh.write(subprocess.run(["git", "show", base + ":" + rel], check=True, capture_output=True).stdout)
          cmd = [sys.executable, os.path.join(d, "tools", "weakening_guard.py"), "--repo", ".", "--base", base,
                 "--head", "HEAD", "--allow", ".github/test_weakening_allow.txt"]
          if b"--collect" in open(os.path.join(d, "tools", "weakening_guard.py"), "rb").read():
              cmd.append("--collect")
          print("guard code and base:", base[:12])
          sys.exit(subprocess.run(cmd).returncode)

      # B33 (H2.7): known spoilings of the red zone (audit B32h H2 + the guarded zone) must all be caught by the guard.
      - name: guard mutation smoke (red zone)
        if: always()
        shell: cmd
        run: python tools/guard_mutation_smoke.py --root .

      # B33 v2 (C5): mutations of the red-zone IMPLEMENTATION (volume cap, confirm TTL, Sigma live flag, host admin
      # check, bypass flag) -- the confirming tests must turn red on each; control run green.
      - name: implementation mutation smoke (red zone)
        if: always()
        shell: cmd
        run: python tools/impl_mutation_smoke.py --root .

      # cmd, not pwsh: pwsh 7 puts its module paths into PSModulePath, and the Windows PowerShell 5.1 started by the
      # tests then cannot load Get-Acl / Get-FileHash.
      - name: pytest src
        shell: cmd
        run: |
          python -m pytest src -q -p no:cacheprovider -rxs --durations=30 --junitxml=pytest_src.xml > pytest_src.txt 2>&1
          set PYTEST_RC=%ERRORLEVEL%
          type pytest_src.txt
          exit /b %PYTEST_RC%

      # Tests outside src/ that need no network and no live model (explicit list; testpaths is not changed).
      - name: pytest root and tools
        if: always()
        shell: cmd
        run: |
          python -m pytest test_data_hygiene.py tools/test_calibrate_sigma.py tools/test_check_sigma_2e.py -q -p no:cacheprovider -rxs --junitxml=pytest_extra.xml > pytest_extra.txt 2>&1
          set PYTEST_RC=%ERRORLEVEL%
          type pytest_extra.txt
          exit /b %PYTEST_RC%

      - name: xfail ids = known list
        if: always()
        shell: pwsh
        run: |
          $known = @(Get-Content .github/known_xfail.txt | Where-Object { $_.Trim() } | ForEach-Object { $_.Trim() } | Sort-Object)
          $got = @(Get-Content pytest_src.txt, pytest_extra.txt | Where-Object { $_.StartsWith("XFAIL ") } | ForEach-Object { ($_.Substring(6) -split ' - ', 2)[0].Trim() } | Sort-Object)
          $unexpected = @($got | Where-Object { $known -notcontains $_ })
          $missing = @($known | Where-Object { $got -notcontains $_ })
          foreach ($x in $unexpected) { Write-Output "UNEXPECTED XFAIL $x" }
          foreach ($x in $missing) { Write-Output "MISSING XFAIL $x" }
          Write-Output "xfail: got $($got.Count), known $($known.Count), unexpected $($unexpected.Count), missing $($missing.Count)"
          if ($unexpected.Count -or $missing.Count) { exit 1 }

      - name: skipped tests = known list
        if: always()
        shell: pwsh
        run: |
          $known = @(Get-Content .github/known_skips.txt -Encoding utf8 | Where-Object { $_.Trim() -and -not $_.StartsWith("#") } | ForEach-Object { $_.Trim() } | Sort-Object)
          $got = @()
          foreach ($f in @("pytest_src.xml", "pytest_extra.xml")) {
            if (-not (Test-Path $f)) { Write-Output "MISSING REPORT $f"; exit 1 }
            $x = New-Object System.Xml.XmlDocument
            $x.Load((Resolve-Path $f).Path)
            foreach ($tc in $x.SelectNodes("//testcase[skipped]")) {
              $sk = $tc.SelectSingleNode("skipped")
              if ($sk.GetAttribute("type") -eq "pytest.xfail") { continue }
              $got += "$($tc.GetAttribute('classname'))::$($tc.GetAttribute('name')) | $($sk.GetAttribute('message'))"
            }
          }
          $unexpected = @($got | Where-Object { $known -notcontains $_ })
          $missing = @($known | Where-Object { $got -notcontains $_ })
          foreach ($x in $unexpected) { Write-Output "UNEXPECTED SKIP $x" }
          foreach ($x in $missing) { Write-Output "MISSING SKIP $x" }
          Write-Output "skipped: got $($got.Count), known $($known.Count), unexpected $($unexpected.Count), missing $($missing.Count)"
          if ($unexpected.Count -or $missing.Count) { exit 1 }

      # Control map vs the JUnit reports of this job (B32): FAIL / ERROR / SKIP without known_gap / XFAIL / XPASS /
      # missing -> red; one platform prints "1 of 2" and gives no PASS (PASS = both required jobs green).
      - name: control map (this platform)
        if: always()
        shell: cmd
        run: python tools/verify_control_map.py --junit windows=pytest_src.xml --junit windows=pytest_extra.xml --base-rev auto --require-base

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: pytest-reports-windows
          path: |
            pytest_src.txt
            pytest_src.xml
            pytest_extra.txt
            pytest_extra.xml
          if-no-files-found: warn
          retention-days: 7

  # The same suite on Linux: the same packages and pytest commands; Windows-only tests are skipped by sys.platform and
  # listed in .github/known_skips_linux.txt. pwsh (preinstalled on the runner) runs the PowerShell tests of the suite.
  pytest-linux:
    name: pytest-linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock

      # Qt runtime of the PyQt6 wheel (offscreen platform); without it the window tests would be skipped.
      - name: System libraries (Qt runtime)
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install dependencies (versions pinned by requirements.lock)
        shell: pwsh
        run: |
          python --version
          pwsh --version
          python -m pip install -c requirements.lock -r requirements.txt pytest pillow pypdf scipy python-docx openpyxl pyloudnorm PyQt6 pymupdf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: test weakening guard (published base)
        if: always()
        shell: bash
        run: python tools/weakening_guard.py --base auto --head HEAD --collect --allow .github/test_weakening_allow.txt

      # B33 (H2.5) + B33 v2 (C3): the same guard with its code taken from the BASE = the published commit (git
      # merge-base HEAD origin/oko-live; none -> red): a change of the guard cannot certify itself; it takes effect
      # from the next snapshot. Lists from this snapshot; --collect only when the base guard knows it.
      - name: test weakening guard (code of the published base)
        if: always()
        shell: python
        run: |
          import os, subprocess, sys, tempfile
          mb = subprocess.run(["git", "merge-base", "HEAD", "refs/remotes/origin/oko-live"], capture_output=True, text=True)
          base = mb.stdout.strip()
          if mb.returncode != 0 or not base:
              print("WEAKENING_ERROR no published base (merge-base HEAD origin/oko-live) -- red")
              sys.exit(2)
          d = tempfile.mkdtemp(prefix="guard_base_")
          for rel in ("src/weakening_guard.py", "tools/weakening_guard.py"):
              os.makedirs(os.path.join(d, os.path.dirname(rel)), exist_ok=True)
              with open(os.path.join(d, rel), "wb") as fh:
                  fh.write(subprocess.run(["git", "show", base + ":" + rel], check=True, capture_output=True).stdout)
          cmd = [sys.executable, os.path.join(d, "tools", "weakening_guard.py"), "--repo", ".", "--base", base,
                 "--head", "HEAD", "--allow", ".github/test_weakening_allow.txt"]
          if b"--collect" in open(os.path.join(d, "tools", "weakening_guard.py"), "rb").read():
              cmd.append("--collect")
          print("guard code and base:", base[:12])
          sys.exit(subprocess.run(cmd).returncode)

      # B33 (H2.7): known spoilings of the red zone (audit B32h H2 + the guarded zone) must all be caught by the guard.
      - name: guard mutation smoke (red zone)
        if: always()
        shell: bash
        run: python tools/guard_mutation_smoke.py --root .

      # B33 v2 (C5): mutations of the red-zone IMPLEMENTATION, as in the Windows job.
      - name: implementation mutation smoke (red zone)
        if: always()
        shell: bash
        run: python tools/impl_mutation_smoke.py --root .

      # bash with set +e: the report is printed before the exit code of pytest is returned (same as the cmd step).
      - name: pytest src
        shell: bash
        run: |
          set +e
          python -m pytest src -q -p no:cacheprovider -rxs --durations=30 --junitxml=pytest_src.xml > pytest_src.txt 2>&1
          PYTEST_RC=$?
          cat pytest_src.txt
          exit $PYTEST_RC

      # Tests outside src/ that need no network and no live model (explicit list; testpaths is not changed).
      - name: pytest root and tools
        if: always()
        shell: bash
        run: |
          set +e
          python -m pytest test_data_hygiene.py tools/test_calibrate_sigma.py tools/test_check_sigma_2e.py -q -p no:cacheprovider -rxs --junitxml=pytest_extra.xml > pytest_extra.txt 2>&1
          PYTEST_RC=$?
          cat pytest_extra.txt
          exit $PYTEST_RC

      - name: xfail ids = known list
        if: always()
        shell: pwsh
        run: |
          $known = @(Get-Content .github/known_xfail.txt | Where-Object { $_.Trim() } | ForEach-Object { $_.Trim() } | Sort-Object)
          $got = @(Get-Content pytest_src.txt, pytest_extra.txt | Where-Object { $_.StartsWith("XFAIL ") } | ForEach-Object { ($_.Substring(6) -split ' - ', 2)[0].Trim() } | Sort-Object)
          $unexpected = @($got | Where-Object { $known -notcontains $_ })
          $missing = @($known | Where-Object { $got -notcontains $_ })
          foreach ($x in $unexpected) { Write-Output "UNEXPECTED XFAIL $x" }
          foreach ($x in $missing) { Write-Output "MISSING XFAIL $x" }
          Write-Output "xfail: got $($got.Count), known $($known.Count), unexpected $($unexpected.Count), missing $($missing.Count)"
          if ($unexpected.Count -or $missing.Count) { exit 1 }

      - name: skipped tests = known list
        if: always()
        shell: pwsh
        run: |
          $known = @(Get-Content .github/known_skips_linux.txt -Encoding utf8 | Where-Object { $_.Trim() -and -not $_.StartsWith("#") } | ForEach-Object { $_.Trim() } | Sort-Object)
          $got = @()
          foreach ($f in @("pytest_src.xml", "pytest_extra.xml")) {
            if (-not (Test-Path $f)) { Write-Output "MISSING REPORT $f"; exit 1 }
            $x = New-Object System.Xml.XmlDocument
            $x.Load((Resolve-Path $f).Path)
            foreach ($tc in $x.SelectNodes("//testcase[skipped]")) {
              $sk = $tc.SelectSingleNode("skipped")
              if ($sk.GetAttribute("type") -eq "pytest.xfail") { continue }
              $got += "$($tc.GetAttribute('classname'))::$($tc.GetAttribute('name')) | $($sk.GetAttribute('message'))"
            }
          }
          $unexpected = @($got | Where-Object { $known -notcontains $_ })
          $missing = @($known | Where-Object { $got -notcontains $_ })
          foreach ($x in $unexpected) { Write-Output "UNEXPECTED SKIP $x" }
          foreach ($x in $missing) { Write-Output "MISSING SKIP $x" }
          Write-Output "skipped: got $($got.Count), known $($known.Count), unexpected $($unexpected.Count), missing $($missing.Count)"
          if ($unexpected.Count -or $missing.Count) { exit 1 }

      # Control map vs the JUnit reports of this job (B32), as in the Windows job.
      - name: control map (this platform)
        if: always()
        shell: bash
        run: python tools/verify_control_map.py --junit linux=pytest_src.xml --junit linux=pytest_extra.xml --base-rev auto --require-base

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: pytest-reports-linux
          path: |
            pytest_src.txt
            pytest_src.xml
            pytest_extra.txt
            pytest_extra.xml
          if-no-files-found: warn
          retention-days: 7

  # Control map over both platforms (B32h): the JUnit reports come from the artifacts of the two jobs; the verifier
  # needs only the standard library (no packages, no network). Its verdict line and exit code also go to a notice
  # annotation of this check run ("both_platforms=yes|no EXIT=<n> | <verdict line>"), readable without a token.
  control-map:
    name: control-map
    needs: [pytest-windows, pytest-linux]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: pytest-reports-windows
          path: reports/windows

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: pytest-reports-linux
          path: reports/linux

      - name: control map (both platforms) + map freshness
        shell: bash
        run: |
          set +e
          python tools/verify_control_map.py \
            --junit windows=reports/windows/pytest_src.xml --junit windows=reports/windows/pytest_extra.xml \
            --junit linux=reports/linux/pytest_src.xml --junit linux=reports/linux/pytest_extra.xml \
            --check-md docs/CONTROL_MAP.md --write-md control_map_fresh.md --generated-on "$GITHUB_SHA" \
            --base-rev auto --require-base > control_map_verify.txt 2>&1
          rc=$?
          cat control_map_verify.txt
          line=$(grep -m1 '^checked on ' control_map_verify.txt)
          both=no
          if grep -qx 'checked on 2 platforms of 2' control_map_verify.txt; then both=yes; fi
          echo "::notice title=control-map::both_platforms=${both} EXIT=${rc} | ${line:-no verdict line}"
          exit $rc

      - name: Upload control map reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: control-map
          path: |
            control_map_verify.txt
            control_map_fresh.md
          if-no-files-found: warn
          retention-days: 7
